h2.t{font-size:clamp(26px,3vw,40px);font-weight:750;letter-spacing:-.018em;line-height:1.12;margin-bottom:10px}
p.lead{font-size:clamp(15px,1.35vw,19px);color:var(--ink2);line-height:1.55;max-width:64ch}
p.lead b,li b{color:var(--ink);font-weight:650}

.slide.top .body{justify-content:flex-start}

.nav button{

.nav button:hover{border-color:var(--s1)}
.hint{position:fixed;left:22px;bottom:22px;font-size:11px;color:var(--muted);z-index:50}

.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gap{gap:22px}

.bandmark{position:absolute;top:-3px;width:3px;height:15px;border-radius:2px;background:var(--s1)}

svg.c{display:block;width:100%;overflow:visible}

.quote{border-left:3px solid var(--s1);padding-left:20px}

}
</style>

function bars(labels, series, fmt){
  fmt=fmt||M;
  var W=560,H=230,L=58,R=8,T=8,B=46,pw=W-L-R,ph=H-T-B;
  var max=0; series.forEach(function(s){s.data.forEach(function(v){if(Math.abs(v)>max)max=Math.abs(v);});});
  var p=Math.pow(10,Math.floor(Math.log10(max||1))),n=(max||1)/p;

  var neg=series.some(function(s){return s.data.some(function(v){return v<0;});});

  var band=pw/labels.length, inner=Math.min(band*.62,96), bw=inner/series.length-3;
  labels.forEach(function(lab,i){
    var x0=L+band*i+(band-inner)/2;

  });
  o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+zero+'" y2="'+zero+'" class="bl"/></svg>';
  return o;
}

var slides=stage.querySelectorAll(".slide"), cur=0;
function go(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach(function(el,i){el.classList.toggle("on",i===cur);});
  document.getElementById("prog").style.width=((cur+1)/slides.length*100)+"%";
  location.hash=cur+1;
}
document.getElementById("nx").addEventListener("click",function(e){e.stopPropagation();go(cur+1);});
document.getElementById("pv").addEventListener("click",function(e){e.stopPropagation();go(cur-1);});
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown")go(cur+1);
  else if(e.key==="ArrowLeft"||e.key==="PageUp")go(cur-1);
  else if(e.key==="Home")go(0);
  else if(e.key==="End")go(slides.length-1);
  else if(e.key==="p"||e.key==="P")window.print();
});
stage.addEventListener("click",function(e){
  if(e.target.closest("input,button,a"))return;
  go(cur+(e.clientX<innerWidth*0.3?-1:1));
});
function fromHash(){var n=parseInt((location.hash||"#1").slice(1),10);return isNaN(n)?0:n-1;}
window.addEventListener("hashchange",function(){var n=fromHash();if(n!==cur)go(n);});

  return '<div class="minirow"><div style="flex:1"><div class="l">'+d.addr+' <span class="tag '+d.gcls+'" style="margin-left:6px">'+d.grade+'</span></div>'+
   '<div class="m">'+d.area+' · '+d.strat+' · '+d.mo+' months · '+M(d.cap)+' capital</div></div>'+
   '<div style="width:230px;margin-left:22px">'+bandHtml(d)+'</div></div>';
}).join("");

/* ── slide 12: live calculator ── */
function calc(){
  var price=+document.getElementById("cp").value,
      rehab=+document.getElementById("cr").value,
      arv=+document.getElementById("ca").value, mo=6;
  var loan=price*.85, pts=loan*.025, interest=loan*.115*mo/12,
      bc=price*.015, hold=800*mo, sell=arv*.06;
  var cap=(price-loan)+pts+bc+rehab+interest+hold;
  var profit=arv-price-rehab-pts-interest-bc-hold-sell;
  var pref=cap*.08*mo/12;
  var inv=profit<=0?profit:Math.min(profit,pref)+Math.max(0,profit-pref)*.7;
  var mao=.70*arv-rehab;
  document.getElementById("cpV").textContent=M0(price);
  document.getElementById("crV").textContent=M0(rehab);
  document.getElementById("caV").textContent=M0(arv);
  var pe=document.getElementById("oProfit"); pe.textContent=M(profit); pe.className="v "+(profit<0?"neg":"");
  var re=document.getElementById("oRet"); re.textContent=P(cap?inv/cap*100:0); re.className="v "+(inv<0?"neg":"");
  document.getElementById("calcT").innerHTML=
   '<tr><td>Sale price after renovation</td><td>'+M0(arv)+'</td></tr>'+
   '<tr><td>Purchase</td><td class="neg">−'+M0(price)+'</td></tr>'+
   '<tr><td>Renovation at SGC cost</td><td class="neg">−'+M0(rehab)+'</td></tr>'+
   '<tr><td>Points, interest, closing, carry</td><td class="neg">−'+M0(pts+interest+bc+hold)+'</td></tr>'+
   '<tr><td>Selling costs</td><td class="neg">−'+M0(sell)+'</td></tr>'+
   '<tr class="tot"><td>Your capital</td><td>'+M0(cap)+'</td></tr>'+
   '<tr class="tot"><td>Your share of profit</td><td class="'+(inv<0?"neg":"")+'">'+M0(inv)+'</td></tr>';
  document.getElementById("calcFlag").innerHTML = profit>=75000
    ? '<span style="color:var(--goodtx)">✓ Clears the $75,000 minimum profit'+(price<=mao?' and the 70% maximum offer of '+M0(mao):' — but above the '+M0(mao)+' maximum offer, so we are paying up')+'</span>'
    : '<span style="color:var(--crit)">✕ Below the $75,000 minimum — negotiate to '+M0(mao)+' or we pass</span>';
}
["cp","cr","ca"].forEach(function(id){document.getElementById(id).addEventListener("input",calc);});
calc();
})();
</script>
