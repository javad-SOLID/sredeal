    --accent: #2a78d6;
    --wash: rgba(42,120,214,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --ink-1: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --seq250:#86b6ef; --seq300:#6da7ec; --seq350:#5598e7; --seq400:#3987e5; --seq450:#2a78d6; --seq500:#256abf; --seq550:#1c5cab;
      --good-text: #0ca30c;
      --accent: #3987e5;
      --wash: rgba(57,135,229,0.14);
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink-1);
    font-size: 14px; line-height: 1.45;
  }
  header.app {
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding: 14px 22px; background: var(--surface-1);
    border-bottom: 1px solid var(--border);
    position: sticky; top:0; z-index: 50;
  }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-mark {
    width:34px; height:34px; border-radius:8px;
    background: linear-gradient(135deg, var(--s1), var(--seq550));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:15px; letter-spacing:-0.5px;
  }
  .logo h1 { font-size:16px; font-weight:700; letter-spacing:-0.2px; }
  .logo .sub { font-size:11px; color: var(--muted); font-weight:500; }
  nav.tabs { display:flex; gap:2px; flex-wrap:wrap; margin-left:8px; }
  nav.tabs button {
    border:none; background:none; color: var(--ink-2);
    font: inherit; font-weight:600; font-size:13px;
    padding: 8px 13px; border-radius:8px; cursor:pointer;
  }
  nav.tabs button:hover { background: var(--wash); color: var(--ink-1); }
  nav.tabs button.on { background: var(--accent); color:#fff; }
  .hdr-actions { margin-left:auto; display:flex; gap:8px; }
  .btn {
    border:1px solid var(--border); background: var(--surface-1); color: var(--ink-1);
    font: inherit; font-weight:600; font-size:13px; padding: 7px 13px;
    border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover { background: var(--wash); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color:#fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--critical); }
  .btn.sm { padding: 4px 9px; font-size:12px; border-radius:6px; }
  main { max-width: 1280px; margin: 0 auto; padding: 22px; }
  .view { display:none; }
  .view.on { display:block; }
  .view-head { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .view-head h2 { font-size:20px; font-weight:750; letter-spacing:-0.3px; }
  .view-head .spacer { flex:1; }
  .hint { color: var(--muted); font-size:12px; }

  /* KPI tiles */
  .tiles { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap:12px; margin-bottom:18px; }
  .tile {
    background: var(--surface-1); border:1px solid var(--border); border-radius:12px;
    padding: 14px 16px;
  }
  .tile .k { font-size:11.5px; font-weight:600; color: var(--ink-2); text-transform:uppercase; letter-spacing:0.4px; }
  .tile .v { font-size:24px; font-weight:750; letter-spacing:-0.5px; margin-top:3px; }
  .tile .d { font-size:12px; color: var(--muted); margin-top:2px; }
  .tile .d .up { color: var(--good-text); font-weight:650; }
  .tile .d .down { color: var(--critical); font-weight:650; }

  /* Cards & grid */
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  @media (max-width: 900px){ .grid2 { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface-1); border:1px solid var(--border); border-radius:12px;
    padding: 16px 18px; margin-bottom:14px;
  }
  .card h3 { font-size:14px; font-weight:700; margin-bottom:2px; }
  .card .sub { font-size:12px; color: var(--muted); margin-bottom:10px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin:4px 0 8px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; font-size:12px; color: var(--ink-2); font-weight:550; }
  .legend i { width:10px; height:10px; border-radius:3px; display:inline-block; }

  /* Tables */
  table.data { width:100%; border-collapse:collapse; font-size:13px; }
  table.data th {
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px;
    color: var(--muted); font-weight:650; padding: 7px 10px; border-bottom:1px solid var(--grid);
    white-space:nowrap;
  }
  table.data td { padding: 9px 10px; border-bottom:1px solid var(--grid); vertical-align:middle; }
  table.data tr:last-child td { border-bottom:none; }
  table.data tr.rowlink { cursor:pointer; }
  table.data tr.rowlink:hover td { background: var(--wash); }
  td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
  .addr { font-weight:650; }
  .addr .area { display:block; font-size:11.5px; color: var(--muted); font-weight:500; }

  /* Pills */
  .pill {
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:650; padding: 3px 9px; border-radius:99px;
    border:1px solid var(--border); color: var(--ink-2); white-space:nowrap;
  }
  .pill.stage { background: var(--wash); color: var(--accent); border-color: transparent; }
  .pill.ok    { color: var(--good-text); background: rgba(12,163,12,0.10); border-color:transparent; }
  .pill.warn  { color: #8a5a00; background: rgba(250,178,25,0.16); border-color:transparent; }
  .pill.bad   { color: var(--critical); background: rgba(208,59,59,0.10); border-color:transparent; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .pill.warn { color:#fab219; }
  }
  .strat { font-size:11px; font-weight:700; letter-spacing:0.3px; }

  /* Progress bars */
  .prog { height:8px; background: var(--grid); border-radius:99px; overflow:hidden; min-width:70px; }
  .prog i { display:block; height:100%; border-radius:99px; background: var(--s1); }

  /* Forms / modal */
  dialog {
    border:1px solid var(--border); border-radius:14px; padding:0;
    background: var(--surface-1); color: var(--ink-1);
    width: min(560px, 92vw); max-height: 88vh;
  }
  dialog::backdrop { background: rgba(0,0,0,0.35); backdrop-filter: blur(2px); }
  .dlg-head { display:flex; align-items:center; padding: 14px 18px; border-bottom:1px solid var(--grid); }
  .dlg-head h3 { font-size:15px; font-weight:700; flex:1; }
  .dlg-body { padding: 16px 18px; overflow:auto; max-height: calc(88vh - 120px); }
  .dlg-foot { display:flex; justify-content:flex-end; gap:8px; padding: 12px 18px; border-top:1px solid var(--grid); }
  .frm { display:grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .frm .full { grid-column: 1 / -1; }
  .frm label { display:block; font-size:11.5px; font-weight:650; color: var(--ink-2); margin-bottom:3px; }
  .frm input, .frm select, .frm textarea {
    width:100%; font: inherit; font-size:13px; color: var(--ink-1);
    background: var(--page); border:1px solid var(--border); border-radius:8px;
    padding: 7px 10px;
  }
  .frm textarea { min-height:60px; resize:vertical; }
  .frm input:focus, .frm select:focus, .frm textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }

  /* Chart bits */
  .chart-wrap { position:relative; }
  svg.chart { display:block; width:100%; height:auto; font-family:inherit; }
  svg.chart text { font-family: inherit; }
  #tip {
    position:fixed; z-index:200; pointer-events:none; display:none;
    background: var(--ink-1); color: var(--page);
    font-size:12px; font-weight:550; padding:6px 10px; border-radius:8px;
    max-width:260px; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  #tip b { font-variant-numeric: tabular-nums; }

  /* Underwriting panel */
  .uw { display:grid; grid-template-columns: 300px 1fr; gap:16px; }
  @media (max-width: 860px){ .uw { grid-template-columns: 1fr; } }
  .uw-out { display:grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap:10px; align-content:start; }
  .uw-stat { background: var(--page); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .uw-stat .k { font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted); font-weight:650; }
  .uw-stat .v { font-size:18px; font-weight:750; margin-top:2px; font-variant-numeric: tabular-nums; }
  .verdict { grid-column: 1/-1; border-radius:10px; padding:12px 14px; font-weight:650; display:flex; gap:8px; align-items:center; }
  .verdict.ok { background: rgba(12,163,12,0.10); color: var(--good-text); }
  .verdict.bad { background: rgba(208,59,59,0.10); color: var(--critical); }
  .verdict.warn { background: rgba(250,178,25,0.16); color: #8a5a00; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .verdict.warn { color: #fab219; }
  }

  /* Scout cards & grade badges */
  .scout-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap:12px; }
  .scard { background: var(--surface-1); border:1px solid var(--border); border-radius:12px; padding:13px 15px; display:flex; flex-direction:column; gap:8px; }
  .scard .top { display:flex; align-items:flex-start; gap:8px; }
  .scard .addr { font-weight:700; }
  .scard .addr a { color: var(--accent); text-decoration:none; }
  .scard .addr a:hover { text-decoration:underline; }
  .scard .city { font-size:11.5px; color: var(--muted); }
  .badge { margin-left:auto; min-width:30px; height:30px; padding:0 7px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:#fff; flex:none; }
  .badge.gA { background: var(--s3); } .badge.gB { background: var(--s1); }
  .badge.gC { background: var(--s4); } .badge.gD { background: var(--critical); }
  .snums { display:grid; grid-template-columns: repeat(auto-fit,minmax(70px,1fr)); gap:6px; }
  .snums .k { font-size:10px; text-transform:uppercase; letter-spacing:0.3px; color:var(--muted); font-weight:650; }
  .snums .v { font-size:13.5px; font-weight:700; font-variant-numeric: tabular-nums; }
  .scard .foot { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:4px; }
  .offtag { font-size:10.5px; font-weight:750; letter-spacing:0.4px; color:#fff; background: var(--s2); border-radius:6px; padding:2px 7px; text-transform:uppercase; }

  /* Tasks & comms */
  .task { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--grid); }
  .task:last-child { border-bottom:none; }
  .task input[type=checkbox]{ width:16px; height:16px; accent-color: var(--accent); cursor:pointer; flex:none; }
  .task .tmain { flex:1; min-width:0; }
  .task .tsub { font-size:11.5px; color: var(--muted); }
  .due { font-size:11.5px; font-weight:650; white-space:nowrap; }
  .due.over { color: var(--critical); }
  .due.soon { color: #8a5a00; }
  @media (prefers-color-scheme: dark){ :root:where(:not([data-theme="light"])) .due.soon { color:#fab219; } }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; border:1px solid var(--border); border-radius:99px; padding:3px 9px; color:var(--ink-2); }
  .clink { color: var(--accent); text-decoration:none; font-weight:650; }
  .clink:hover { text-decoration:underline; }

  /* ===== iPad / touch / standalone app ===== */
  html { -webkit-text-size-adjust: 100%; }
  body { -webkit-tap-highlight-color: rgba(42,120,214,0.15); overscroll-behavior-y: contain; }
  header.app { padding-top: calc(14px + env(safe-area-inset-top)); }
  main { padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
  .scroll-x { overflow-x:auto; -webkit-overflow-scrolling:touch; }

  @media (max-width: 1100px) {
    header.app { gap:10px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .logo .sub { display:none; }
    nav.tabs {
      order:10; width:100%; margin:2px -12px 0; padding:0 12px 8px;
      flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; scroll-snap-type:x proximity;
    }
    nav.tabs::-webkit-scrollbar { display:none; }
    nav.tabs button { flex:none; scroll-snap-align:start; }
    main { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    .card { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table.data { min-width: 700px; }
    .uw { grid-template-columns: 1fr; }
  }
  @media (hover: none) {
    .btn { min-height:38px; padding:9px 14px; }
    .btn.sm { min-height:34px; padding:7px 12px; font-size:12.5px; }
    nav.tabs button { min-height:40px; padding:9px 15px; font-size:13.5px; }
    table.data td, table.data th { padding:12px 10px; }
    .task { padding:12px 4px; }
    .task input[type=checkbox] { width:22px; height:22px; }
    /* 16px stops iOS from zooming the page when a field is focused */
    input, select, textarea, .frm input, .frm select, .frm textarea { font-size:16px !important; }
    .scard .foot select { font-size:16px !important; min-height:34px; }
  }

  /* ===== Passcode lock ===== */
  .lock {
    position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center;
    background: var(--page); padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  }
  .lock[hidden] { display:none; }
  .lockbox { width:min(330px, 100%); text-align:center; }
  .lockbox .logo-mark { width:60px; height:60px; border-radius:14px; font-size:24px; margin:0 auto 16px; }
  .lockbox h2 { font-size:18px; font-weight:700; letter-spacing:-0.2px; }
  .lockbox .lsub { font-size:13px; color:var(--muted); margin-top:4px; }
  .dots { display:flex; gap:12px; justify-content:center; margin:22px 0 6px; min-height:16px; }
  .dots i { width:13px; height:13px; border-radius:99px; border:1.5px solid var(--baseline); display:block; }
  .dots i.on { background:var(--accent); border-color:var(--accent); }
  .lockmsg { min-height:20px; font-size:12.5px; font-weight:600; color:var(--critical); margin-bottom:10px; }
  .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .keypad button {
    font:inherit; font-size:22px; font-weight:600; color:var(--ink-1);
    background:var(--surface-1); border:1px solid var(--border); border-radius:99px;
    height:64px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .keypad button:active { background:var(--wash); transform:scale(0.96); }
  .keypad button.act { font-size:14px; font-weight:700; }
  .keypad button.go { background:var(--accent); border-color:var(--accent); color:#fff; }
  .keypad button.blank { background:none; border:none; cursor:default; }
  .locklink { margin-top:16px; font-size:12.5px; }
  .locklink a { color:var(--accent); font-weight:650; cursor:pointer; text-decoration:none; }

  .banner {
    background:var(--wash); border:1px solid var(--accent); border-radius:12px;
    padding:14px 16px; margin-bottom:16px; font-size:13px;
  }
  .banner b { display:block; font-size:14px; margin-bottom:3px; }

  .muted { color: var(--muted); }
  .right { text-align:right; }
  .mb0 { margin-bottom:0; }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; font-size:13px; }
  footer.app { text-align:center; color:var(--muted); font-size:11.5px; padding: 10px 0 26px; }
</style>
</head>
<body>
<header class="app">
  <div class="logo">
    <div class="logo-mark">SG</div>
    <div>
      <h1>Solid Ground Capital</h1>
      <div class="sub">Command Center — scout · invest · build · coordinate</div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="dash" class="on">Dashboard</button>
    <button data-v="scout">Deal Scout</button>
    <button data-v="leads">Leads</button>
    <button data-v="deals">Deals</button>
    <button data-v="projects">Projects</button>
    <button data-v="crew">Crew</button>
    <button data-v="partners">Partners</button>
    <button data-v="loans">Loans</button>
    <button data-v="investors">Investors</button>
    <button data-v="money">Financials</button>
    <button data-v="comms">Comms</button>

  <div class="hdr-actions">
    <a class="btn" href="https://drive.google.com/drive/folders/1p3jq_eiy1larrBiwkX9epBe3AQ7Gv5Hl" target="_blank" rel="noopener" title="Open the project folder in Google Drive (My Drive › Claude › Projects › Real Estate investment)" style="text-decoration:none">📁 Project files</a>
    <button class="btn" id="btnLock" title="Lock the app" hidden>🔒</button>
    <button class="btn" id="btnLoad" title="Load a saved data file">📂 Load</button>
    <button class="btn primary" id="btnSave" title="Save / share a backup of all data">💾 Save</button>
    <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
  </div>
</header>

<main>
  <section class="view on" id="v-dash"></section>
  <section class="view" id="v-scout"></section>
  <section class="view" id="v-leads"></section>
  <section class="view" id="v-deals"></section>
  <section class="view" id="v-projects"></section>
  <section class="view" id="v-crew"></section>
  <section class="view" id="v-partners"></section>
  <section class="view" id="v-loans"></section>
  <section class="view" id="v-investors"></section>
  <section class="view" id="v-money"></section>
  <section class="view" id="v-comms"></section>
</main>

<footer class="app">
  <div>Solid Ground Capital Command Center · data stays on this device — use Save to back it up · assumptions editable in Deals ⚙</div>
  <div id="devTools" style="margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"></div>
</footer>

<div class="lock" id="lock" hidden>
  <div class="lockbox">
    <div class="logo-mark">SG</div>
    <h2 id="lockTitle">Enter passcode</h2>
    <div class="lsub" id="lockSub">Solid Ground Capital</div>
    <div class="dots" id="lockDots"></div>
    <div class="lockmsg" id="lockMsg"></div>
    <div class="keypad" id="keypad"></div>
    <div class="locklink" id="lockLink"></div>
  </div>
</div>

<div id="tip"></div>
<dialog id="dlg">
  <div class="dlg-head"><h3 id="dlgTitle"></h3><button class="btn sm" onclick="document.getElementById('dlg').close()">✕</button></div>
  <div class="dlg-body"><div class="frm" id="dlgForm"></div></div>
  <div class="dlg-foot">
    <button class="btn" onclick="document.getElementById('dlg').close()">Cancel</button>
    <button class="btn primary" id="dlgSave">Save</button>
  </div>

/* ============ STATE / PERSISTENCE ============ */
// Published copies ship blank (<html data-seed="blank">) so no real names live in a public file;
// the app then runs entirely on the data you load and keep on this device.
const BLANK_START = document.documentElement.dataset.seed === "blank";
const EMPTY = { meta:{firm:"Solid Ground Capital", version:2}, settings:SEED.settings,
  leads:[], deals:[], projects:[], crew:[], investors:[], transactions:[],
  partners:[], scout:[], loans:[], inspections:[], comms:[] };
let S = JSON.parse(JSON.stringify(BLANK_START ? EMPTY : SEED));
let uid = () => Math.random().toString(36).slice(2,9);

/* --- normalize any incoming data so older exports keep working --- */
function normalize(data){
  if(!data || !data.meta) throw new Error("Not a Solid Ground data file");
  data.settings = Object.assign({}, SEED.settings, data.settings || {});
  ["leads","deals","projects","crew","investors","transactions",
   "partners","scout","loans","inspections","comms"].forEach(k => { if(!Array.isArray(data[k])) data[k] = []; });
  data.deals.forEach(d => { if(!d.team) d.team = {agent:"", escrow:"", title:"", lender:"", inspector:""}; });
  return data;
}

/* --- device storage (silently no-ops where storage is blocked) --- */
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const HAS_STORE = (()=>{ try { localStorage.setItem("__sgc","1"); localStorage.removeItem("__sgc"); return true; } catch(e){ return false; } })();
const SUBTLE = (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
const K_DATA="sgc_cc_data", K_SALT="sgc_cc_salt", K_VERIFY="sgc_cc_verify", K_NOPIN="sgc_cc_nopin";
let cryptoKey = null;   // AES-GCM key derived from the passcode; null = stored in the clear

const b64 = buf => { const a = new Uint8Array(buf); let s=""; for(let i=0;i<a.length;i+=8192) s += String.fromCharCode.apply(null, a.subarray(i,i+8192)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pin, salt){
  const base = await SUBTLE.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  return SUBTLE.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"}, base,
    {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encStr(str){
  if(!cryptoKey) return "p:" + str;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await SUBTLE.encrypt({name:"AES-GCM", iv}, cryptoKey, new TextEncoder().encode(str));
  return "e:" + b64(iv) + ":" + b64(ct);
}
async function decStr(blob){
  if(blob.slice(0,2) === "p:") return blob.slice(2);
  const parts = blob.split(":");
  const pt = await SUBTLE.decrypt({name:"AES-GCM", iv:unb64(parts[1])}, cryptoKey, unb64(parts[2]));
  return new TextDecoder().decode(pt);
}

let saveTimer = null, saving = false;
function autoSave(){
  if(!HAS_STORE) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(saving) return; saving = true;
    try { LS.set(K_DATA, await encStr(JSON.stringify(S))); } catch(e){} finally { saving = false; }
  }, 500);
}
async function loadLocal(){
  const raw = LS.get(K_DATA); if(!raw) return false;
  try { S = normalize(JSON.parse(await decStr(raw))); return true; }
  catch(e){ return false; }
}

/* --- file save / load (backup + moving data between your Mac and iPad) --- */
async function saveFile(){
  const name = `SolidGround_CommandCenter_${new Date().toISOString().slice(0,10)}.json`;
  const text = JSON.stringify(S, null, 2);
  const blob = new Blob([text], {type:"application/json"});
  // iPad: hand it to the share sheet so it can go to Files, AirDrop, Mail…
  try {
    const file = new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  } catch(e){ if(e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function loadFile(file){
  const r = new FileReader();
  r.onload = () => {
    try { S = normalize(JSON.parse(r.result)); renderAll(); autoSave();
          alert("Loaded — "+S.deals.length+" deals, "+S.investors.length+" investors, "+S.partners.length+" partners."); }
    catch(e){ alert("Couldn't load file: " + e.message); }
  };
  r.readAsText(file);
}
document.getElementById("btnSave").onclick = saveFile;
document.getElementById("btnLoad").onclick = () => document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange = e => { if(e.target.files[0]) loadFile(e.target.files[0]); e.target.value=""; };

function buildKeypad(){
  const keys = ["1","2","3","4","5","6","7","8","9","del","0","go"];
  document.getElementById("keypad").innerHTML = keys.map(k=>{
    if(k==="del") return `<button class="act" data-k="del" aria-label="Delete">⌫</button>`;
    if(k==="go")  return `<button class="act go" data-k="go" aria-label="Confirm">✓</button>`;
    return `<button data-k="${k}">${k}</button>`;
  }).join("");
}

function showLock(mode){
  lockMode = mode; entry = ""; drawDots(); buildKeypad();
  document.getElementById("lockMsg").textContent = "";
  const t = {enter:"Enter passcode", set:"Create a passcode", confirm:"Confirm passcode", change:"Enter a new passcode"}[mode];
  document.getElementById("lockTitle").textContent = t;
  document.getElementById("lockSub").textContent = mode==="enter" ? "Solid Ground Capital" : "4–6 digits · unlocks the data on this device";

    ? `<a onclick="skipPin()">Not now — don't lock this device</a>` : "";

}
function hideLock(){ lockEl.hidden = true; entry = ""; }
async function submitPin(){
  if(entry.length < 4){ document.getElementById("lockMsg").textContent = "Passcode must be at least 4 digits"; return; }
  const pin = entry;
  if(lockMode === "set" || lockMode === "change"){
    pendingPin = pin; entry = ""; drawDots();
    lockMode = "confirm"; document.getElementById("lockTitle").textContent = "Confirm passcode"; document.getElementById("lockLink").innerHTML = "";
    return;
  }
  if(lockMode === "confirm"){
    if(pin !== pendingPin){ entry=""; drawDots(); document.getElementById("lockMsg").textContent = "Didn't match — start again"; lockMode="set"; document.getElementById("lockTitle").textContent="Create a passcode"; return; }
    await setPin(pin); return;
  }
  // enter
  document.getElementById("lockMsg").textContent = "Checking…";
  const ok = await tryUnlock(pin);
  if(!ok){ entry = ""; drawDots(); document.getElementById("lockMsg").textContent = "Wrong passcode"; }
}
async function setPin(pin){
  if(!SUBTLE){ LS.set(K_NOPIN,"1"); hideLock(); renderAll(); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  cryptoKey = await deriveKey(pin, salt);
  LS.set(K_SALT, b64(salt));
  LS.set(K_VERIFY, await encStr("SGC-OK"));
  LS.del(K_NOPIN);
  clearTimeout(saveTimer);
  LS.set(K_DATA, await encStr(JSON.stringify(S)));
  document.getElementById("btnLock").hidden = false;
  hideLock(); renderAll();
}
async function tryUnlock(pin){
  try {
    cryptoKey = await deriveKey(pin, unb64(LS.get(K_SALT)));
    if(await decStr(LS.get(K_VERIFY)) !== "SGC-OK") throw new Error("bad");
  } catch(e){ cryptoKey = null; return false; }
  await loadLocal();
  document.getElementById("btnLock").hidden = false;
  hideLock(); renderAll(); return true;
}
function skipPin(){ LS.set(K_NOPIN,"1"); hideLock(); autoSave(); renderAll(); }
function lockNow(){ if(LS.get(K_SALT)){ cryptoKey = null; showLock("enter"); } }

  showLock("change");
}
function forgetData(){
  if(!confirm("Remove all Command Center data saved on this device? Your saved JSON backups are not affected.")) return;
  [K_DATA,K_SALT,K_VERIFY,K_NOPIN].forEach(k=>LS.del(k));

}

/* ============ UNDERWRITING ENGINE ============ */
function underwrite(d){
  const st = S.settings;
  const loanBase = (d.purchase||0) + (d.rehab||0);
  const points = loanBase * st.hardMoneyPoints/100;
  const interest = loanBase * st.hardMoneyRate/100 * (d.holdMonths||6)/12;
  const buyClose = (d.purchase||0) * st.buyClosePct/100;
  const sellCosts = (d.arv||0) * st.sellCostPct/100;
  const mao = (d.arv||0) * st.maoPct/100 - (d.rehab||0);
  const allIn = loanBase + points + interest + buyClose;
  const out = { mao, points, interest, buyClose, sellCosts, allIn };

  if(d.strategy === "Wholesale"){
    out.fee = Math.max(0, mao - (d.purchase||0));
    out.profit = out.fee;
    out.roiPct = d.purchase ? out.fee/(d.purchase*0.03)*100 : 0; // vs typical EMD risk
    out.verdict = out.fee >= 10000 ? "ok" : (out.fee > 0 ? "warn" : "bad");
    out.verdictText = out.fee >= 10000 ? `Assignable — spread ${money(out.fee)} vs MAO` :
                      out.fee > 0 ? `Thin — only ${money(out.fee)} under MAO` : `Over MAO by ${money(-out.fee)} — renegotiate or pass`;
  } else if(d.strategy === "BRRRR" || d.strategy === "Hold"){
    const noi = (d.rentMo||0)*12 * (1 - st.expenseRatioPct/100);
    const refiLoan = (d.arv||0) * st.refiLtvPct/100;
    const r = st.dscrRate/100/12, n = 360;
    const pay = refiLoan>0 ? refiLoan * r / (1 - Math.pow(1+r,-n)) : 0;
    out.noi = noi; out.refiLoan = refiLoan; out.debtSvcMo = pay;
    out.dscr = pay>0 ? (d.rentMo||0)/pay : 0; // lender convention: gross rent / debt service
    out.cashOut = refiLoan - allIn;
    out.cashFlowMo = noi/12 - pay;
    out.capLeft = Math.max(0, -out.cashOut);
    out.profit = out.cashFlowMo*12;
    out.verdict = (out.dscr>=1.1 && out.cashFlowMo>=0) ? "ok" : (out.dscr>=1.0 ? "warn" : "bad");
    out.verdictText = out.dscr>=1.1 && out.cashFlowMo>=0 ? `DSCR ${out.dscr.toFixed(2)} — refi should clear, ${money(out.cashFlowMo)}/mo cash flow` :
                      out.dscr>=1.0 ? `DSCR ${out.dscr.toFixed(2)} — tight, lender may cut LTV` : `DSCR ${out.dscr.toFixed(2)} — won't qualify at ${st.dscrRate}%`;
  } else if(d.strategy === "Ground-Up"){
    // Large Projects tier: purchase = land/site, rehab = hard construction at SGC cost
    const soft = (d.rehab||0) * st.softCostPct/100;
    const totalCost = (d.purchase||0) + (d.rehab||0) + soft;
    const gPoints = totalCost * st.hardMoneyPoints/100;
    const gInterest = totalCost * 0.6 * st.hardMoneyRate/100 * (d.holdMonths||18)/12; // ~60% avg drawn balance
    const gAllIn = totalCost + gPoints + gInterest + buyClose;
    out.soft = soft; out.totalCost = totalCost; out.points = gPoints; out.interest = gInterest; out.allIn = gAllIn;
    out.profit = (d.arv||0) - gAllIn - sellCosts;
    out.marginPct = gAllIn>0 ? out.profit/gAllIn*100 : 0;
    out.roiPct = out.marginPct;
    out.overCap = gAllIn > st.largeMaxCost;
    out.verdict = (!out.overCap && out.marginPct >= st.largeMinMarginPct) ? "ok" :
                  (!out.overCap && out.marginPct >= st.largeMinMarginPct*0.7) ? "warn" : "bad";
    out.verdictText = out.overCap ? `All-in ${moneyK(gAllIn)} exceeds the ${moneyK(st.largeMaxCost)} Large Projects cap — phase, JV, or pass` :
                      out.marginPct >= st.largeMinMarginPct ? `Clears the Large Projects tier — ${pctf(out.marginPct)} margin on ${moneyK(gAllIn)} all-in` :
                      out.marginPct >= st.largeMinMarginPct*0.7 ? `Thin — ${pctf(out.marginPct)} margin vs ${st.largeMinMarginPct}% tier minimum` :
                      `Doesn't pencil — ${pctf(out.marginPct)} margin on cost`;
  } else { // Flip & ADU
    out.profit = (d.arv||0) - allIn - sellCosts;
    out.roiPct = allIn>0 ? out.profit/allIn*100 : 0;
    out.overMao = (d.purchase||0) - mao;
    out.verdict = out.profit >= st.minFlipProfit ? "ok" : (out.profit >= st.minFlipProfit*0.6 ? "warn" : "bad");
    out.verdictText = out.profit >= st.minFlipProfit ? `Clears ${moneyK(st.minFlipProfit)} min — projected ${money(out.profit)} profit` :
                      out.profit >= st.minFlipProfit*0.6 ? `Below ${moneyK(st.minFlipProfit)} target — ${money(out.profit)} projected` : `Doesn't pencil — ${money(out.profit)} projected`;
  }
  return out;
}

/* ============ CHART BUILDERS (inline SVG) ============ */
const CV = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function niceMax(v){
  if(v<=0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(m*p >= v) return m*p;
  return 10*p;
}

// Grouped/simple vertical bar chart. series: [{name, color, values[]}]
function barChart({labels, series, h=210, fmt=moneyK, tipFmt=money}){
  const W=640, padL=52, padR=10, padT=12, padB=26;
  const plotW = W-padL-padR, plotH = h-padT-padB;
  const max = niceMax(Math.max(1,...series.flatMap(s=>s.values)));
  const n = labels.length, ns = series.length;
  const slot = plotW/n;
  const barW = Math.min(34, (slot*0.72 - (ns-1)*2)/ns);
  const groupW = barW*ns + (ns-1)*2;
  let g = "";
  // gridlines + y labels
  for(let i=0;i<=4;i++){
    const y = padT + plotH - plotH*i/4;
    g += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${padL-7}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${fmt(max*i/4)}</text>`;
  }
  labels.forEach((lb,i)=>{
    const cx = padL + slot*i + slot/2;
    series.forEach((s,si)=>{
      const v = s.values[i]||0;
      const bh = Math.max(0, plotH * v/max);
      const x = cx - groupW/2 + si*(barW+2);
      const y = padT + plotH - bh;
      const r = Math.min(4, bh);
      g += `<path d="M${x},${padT+plotH} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+barW-r},${y} Q${x+barW},${y} ${x+barW},${y+r} L${x+barW},${padT+plotH} Z" fill="${s.color}" data-tip="${esc(lb)}${ns>1?" · "+esc(s.name):""}: <b>${tipFmt(v)}</b>"/>`;
    });
    const short = lb.length>10 ? lb.slice(0,9)+"…" : lb;
    g += `<text x="${cx}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(short)}</text>`;
  });
  g += `<line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--baseline)" stroke-width="1"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}

// Horizontal bar chart (funnel / rankings). rows: [{label, value, color, tip}]
function hbarChart({rows, h, fmt=String, tipFmt=null}){
  const W=640, padL=150, padR=64, rowH=30;
  const H = h || rows.length*rowH + 14;
  const plotW = W-padL-padR;
  const max = niceMax(Math.max(1,...rows.map(r=>r.value)));
  let g = "";
  rows.forEach((r,i)=>{
    const y = 8 + i*rowH;
    const bw = Math.max(2, plotW * r.value/max);
    const rr = Math.min(4, bw);
    g += `<text x="${padL-9}" y="${y+15}" text-anchor="end" font-size="11.5" font-weight="550" fill="var(--ink-2)">${esc(r.label.length>20?r.label.slice(0,19)+"…":r.label)}</text>`;
    g += `<path d="M${padL},${y+4} L${padL+bw-rr},${y+4} Q${padL+bw},${y+4} ${padL+bw},${y+4+rr} L${padL+bw},${y+22-rr} Q${padL+bw},${y+22} ${padL+bw-rr},${y+22} L${padL},${y+22} Z" fill="${r.color}" data-tip="${r.tip || esc(r.label)+': <b>'+fmt(r.value)+'</b>'}"/>`;
    g += `<text x="${padL+bw+7}" y="${y+17}" font-size="11" font-weight="650" fill="var(--ink-1)" style="font-variant-numeric:tabular-nums">${fmt(r.value)}</text>`;
  });
  g += `<line x1="${padL}" y1="4" x2="${padL}" y2="${H-6}" stroke="var(--baseline)" stroke-width="1"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

// Line chart, single or multi series. series: [{name,color,values[]}]
function lineChart({labels, series, h=220, fmt=moneyK, tipFmt=money, zeroBased=false}){
  const W=640, padL=56, padR=30, padT=12, padB=26;
  const plotW=W-padL-padR, plotH=h-padT-padB;
  const all = series.flatMap(s=>s.values);
  let lo = Math.min(0,...all), hi = niceMax(Math.max(1,...all));
  if(lo<0){ lo = -niceMax(-Math.min(...all)); }
  const span = hi-lo;
  const X = i => padL + plotW * (labels.length===1?0.5:i/(labels.length-1));
  const Y = v => padT + plotH - plotH*(v-lo)/span;
  let g="";
  for(let i=0;i<=4;i++){
    const v = lo + span*i/4, y = Y(v);
    g += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${Math.abs(v)<1e-9?"var(--baseline)":"var(--grid)"}" stroke-width="1"/>`;
    g += `<text x="${padL-7}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${fmt(v)}</text>`;
  }
  labels.forEach((lb,i)=>{
    if(labels.length<=8 || i%2===0)
      g += `<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(lb)}</text>`;
  });
  series.forEach(s=>{
    const pts = s.values.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>{
      g += `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`;
      g += `<rect x="${X(i)-10}" y="${padT}" width="20" height="${plotH}" fill="transparent" data-tip="${esc(labels[i])}${series.length>1?" · "+esc(s.name):""}: <b>${tipFmt(v)}</b>"/>`;
    });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}

/* ============ AGGREGATES ============ */
const LEAD_STAGES = ["New","Contacted","Negotiating","Under Contract","Dead"];
const DEAL_STAGES = ["Analyzing","Offer Out","Under Contract","Closed","Passed"];
const ORD = [CV("--seq250"),CV("--seq350"),CV("--seq450"),CV("--seq550"),CV("--baseline")];

function agg(){
  const committed = S.investors.reduce((a,i)=>a+(+i.committed||0),0);
  const funded = S.investors.reduce((a,i)=>a+(+i.funded||0),0);
  const cash = S.transactions.reduce((a,t)=>a+(+t.amount||0),0);
  const activeDeals = S.deals.filter(d=>!["Passed","Closed"].includes(d.stage));
  const pipelineProfit = activeDeals.reduce((a,d)=>a+Math.max(0,underwrite(d).profit||0),0);
  const activeProjects = S.projects.filter(p=>p.stage!=="Complete");
  const budgetTotal = activeProjects.reduce((a,p)=>a+(+p.budget||0),0);
  const spentTotal = activeProjects.reduce((a,p)=>a+p.cats.reduce((x,c)=>x+(+c.actual||0),0),0);
  const activeLeads = S.leads.filter(l=>l.stage!=="Dead").length;
  return {committed, funded, cash, pipelineProfit, activeDeals, activeProjects, budgetTotal, spentTotal, activeLeads};
}
function monthlyCash(){
  const byM = {};
  S.transactions.forEach(t=>{ const m = (t.date||"").slice(0,7); if(m) byM[m]=(byM[m]||0)+(+t.amount||0); });
  const ms = Object.keys(byM).sort();
  let run=0;
  const labels = ms.map(m=>{ const [y,mo]=m.split("-"); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][mo-1]+" '"+y.slice(2); });
  const cum = ms.map(m=>run+=byM[m]);
  return {labels, cum, net: ms.map(m=>byM[m])};
}

    d.arv?`<div><div class="k">ARV</div><div class="v">${moneyK(d.arv)}</div></div>`:"",

function importScout(){
  const holder = {json:""};
  openForm("Import Deal Scout JSON", [
    {key:"json", label:"Paste the catalog JSON (an array of deals, or {\"deals\":[…]}) — keys like addr/address, area/city, price/ask, arv, rehab, units, type, grade, agent, url, notes are all understood", type:"textarea", full:true}
  ], holder, o=>{
    try {
      let data = JSON.parse(o.json);
      if(data && Array.isArray(data.deals)) data = data.deals;
      if(!Array.isArray(data)) throw new Error("Expected an array of deals or {deals:[…]}");
      let n=0;
      data.forEach(x=>{
        const addr = x.addr||x.address||x.street||""; if(!addr) return;
        if(S.scout.some(s=>s.addr.toLowerCase()===addr.toLowerCase())) return; // skip dupes
        let type = (x.type||"").toLowerCase();
        if(!SCOUT_TYPES[type]) type = (+x.units||0)>=2 ? "mf" : "flip";
        S.scout.unshift({ id:"SC"+uid(), src:"scout", offMarket:!!(x.offMarket||x.offmarket),
          partnerId:"", addr, area:x.area||x.city||x.zip||"", type,
          grade:x.grade||"", price:+(x.price??x.ask??x.listPrice??0)||0, arv:+x.arv||0, rehab:+x.rehab||0,
          units:+x.units||0, agentInfo:x.agentInfo||x.agent||x.broker||"", url:x.url||x.link||x.href||"",
          notes:x.notes||x.angle||x.summary||"", status:"New", date:today() });
        n++;
      });
      renderAll(); showView("scout");
      alert(n + " deal(s) imported" + (n<data.length ? " ("+(data.length-n)+" skipped — duplicates or missing address)" : ""));
    } catch(e){ alert("Couldn't import: " + e.message); }
  });
}

      </div>
      <table class="data"><thead><tr><th>Date</th><th>Channel</th><th>Deal</th><th>With</th><th>Summary</th><th>Next action</th><th></th></tr></thead>
      <tbody>${logRows || `<tr><td colspan="7" class="empty">Nothing logged yet — every call, email and site visit belongs here</td></tr>`}</tbody></table>
    </div>`;
}

/* ============ NAV / BOOT ============ */
function showView(v){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on", x.id==="v-"+v));
}
document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(b) showView(b.dataset.v);
});
function renderAll(){
  renderDash(); renderScout(); renderLeads(); renderDeals(); renderProjects(); renderCrew();
  renderPartners(); renderLoans(); renderInvestors(); renderMoney(); renderComms();
}

/* every render follows a change, so persist after each one (debounced to one write) */
["renderAll","renderDash","renderScout","renderLeads","renderDeals","renderProjects",
 "renderCrew","renderPartners","renderLoans","renderInvestors","renderMoney","renderComms"]
  .forEach(n=>{ const f = window[n]; window[n] = function(){ const r = f.apply(this, arguments); autoSave(); return r; }; });

/* ============ BOOT ============ */
function renderDevTools(){
  const el = $("#devTools"); if(!el) return;
  if(!HAS_STORE){ el.innerHTML = `<span class="hint">Preview mode — changes aren't saved on this device. Use 💾 Save to keep a copy.</span>`; return; }
  const locked = !!LS.get(K_SALT);
  el.innerHTML =
    `<button class="btn sm" onclick="changePin()">${locked?"Change passcode":"Set a passcode"}</button>` +
    `<button class="btn sm danger" onclick="forgetData()">Forget data on this device</button>`;
}
async function boot(){
  buildKeypad();
  if(!HAS_STORE){ renderAll(); renderDevTools(); return; }   // sandboxed preview — in-memory only
  if(LS.get(K_SALT)){                       // passcode already set: unlock before showing anything
    showLock("enter"); renderDevTools(); return;
  }
  if(LS.get(K_NOPIN)){                      // chose no passcode
    await loadLocal(); renderAll(); renderDevTools(); return;
  }
  await loadLocal(); renderAll(); renderDevTools();
  if(SUBTLE) showLock("set");               // first run: offer to lock the device
}
const _dev = renderDevTools;
["setPin","skipPin","tryUnlock","forgetData"].forEach(n=>{ const f = window[n]; window[n] = async function(){ const r = await f.apply(this, arguments); _dev(); return r; }; });
boot();
</script>
</body>
